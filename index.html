<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F0EEF8">
<title>ことりば</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <button class="icon" id="back" hidden aria-label="部屋の一覧へ戻る">←</button>
    <div class="brand"><h1 id="title">ことりば</h1><p id="sub">ひとことから始まる、みんなの部屋</p></div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">接続中</span></div>
    <button class="icon" id="settingsBtn" hidden aria-label="部屋の設定">⚙</button>
  </header>

  <section id="lobby">
    <div class="bar">
      <span class="me-name"><span id="meText"></span><button id="renameBtn" type="button">変更</button></span>
      <button class="send" id="makeBtn0" type="button">部屋をつくる</button>
    </div>
    <div id="rooms"></div>
  </section>

  <section id="chat" hidden>
    <div id="onlinePanel" class="online-panel" aria-label="オンラインメンバー">
      <div class="online-top">
        <div class="online-title">
          <span class="online-sparkle" aria-hidden="true">✳</span>
          <div>
            <div class="online-heading">この部屋にいる人</div>
            <div class="online-caption">いま、おしゃべりできるメンバー</div>
          </div>
        </div>
        <div class="online-count-wrap" aria-live="polite" aria-atomic="true">
          <span class="online-indicator"></span>
          <span id="onlineCount">0</span>
          <span class="online-count-label">人</span>
        </div>
      </div>
      <div class="online-divider"></div>
      <div id="onlineMembers" class="online-members" aria-live="polite">
        <span class="online-empty">みんなの到着を待っています…</span>
      </div>
    </div>
    <main id="feed" aria-live="polite"></main>
    <form id="form">
      <textarea id="input" rows="1" maxlength="1000" placeholder="メッセージを書く（Enterで送信、Shift+Enterで改行）" aria-label="メッセージ"></textarea>
      <button class="send" id="send" disabled>送信</button>
    </form>
  </section>
</div>

<dialog id="join">
  <h2>はじめまして</h2>
  <p>部屋で使う名前を決めてください。あとから変えられます。</p>
  <input id="nameInput" maxlength="20" placeholder="例: みどり" aria-label="表示名" autocomplete="nickname">
  <div class="stack"><button class="send" id="joinBtn" type="button">決定</button></div>
</dialog>

<dialog id="gate">
  <h2 id="gateTitle">合言葉を入力</h2>
  <p>この部屋のパスワードを入れてください。</p>
  <input id="pwInput" type="password" placeholder="パスワード" aria-label="パスワード" autocomplete="off">
  <p class="err" id="gateErr" role="alert"></p>
  <div class="stack"><button class="send" id="gateBtn" type="button">入る</button><button class="send ghost" id="gateCancel" type="button">キャンセル</button></div>
</dialog>

<dialog id="make">
  <h2>部屋をつくる</h2>
  <p>パスワードを決めると、知っている人だけが入れます。空欄なら誰でも入れます。あなたがオーナーになります。</p>
  <input id="roomName" maxlength="30" placeholder="部屋の名前" aria-label="部屋の名前">
  <input id="roomPw" type="password" placeholder="パスワード（任意・4文字以上）" aria-label="パスワード" autocomplete="new-password">
  <p class="err" id="makeErr" role="alert"></p>
  <div class="stack"><button class="send" id="makeBtn" type="button">つくる</button><button class="send ghost" id="makeCancel" type="button">キャンセル</button></div>
</dialog>

<dialog id="cfg">
  <h2>部屋の設定</h2>
  <p>オーナーだけが変更できます。</p>
  <input id="newPw" type="password" placeholder="新しいパスワード（空欄で解除）" aria-label="新しいパスワード" autocomplete="new-password">
  <label class="chk"><input type="checkbox" id="kick">今いるほかのメンバーを退室させる</label>
  <p class="err" id="cfgErr" role="alert"></p>
  <div class="stack">
    <button class="send" id="cfgSave" type="button">保存</button>
    <button class="send danger" id="cfgDelete" type="button">この部屋を削除</button>
    <button class="send ghost" id="cfgClose" type="button">閉じる</button>
  </div>
</dialog>
<div class="toast" id="toast" hidden role="status"></div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
